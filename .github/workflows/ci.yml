name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ---------------------------------------------------------------------------
  # Lint + format + type-check every service. Matrix fans out over the three
  # services; each runs ruff check, ruff format --check and mypy over its app/.
  # ---------------------------------------------------------------------------
  quality:
    name: Quality (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [order-service, inventory-service, notification-service]

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.5"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        # Sync the whole workspace so cross-service deps (e.g. `shared`) are
        # built and installed alongside this service's own tree. --all-packages
        # also installs the [dependency-groups].dev tools (ruff, mypy, pytest).
        run: uv sync --frozen --all-packages

      - name: Ruff lint
        run: uv run --package ${{ matrix.service }} ruff check .

      - name: Ruff format check
        run: uv run --package ${{ matrix.service }} ruff format --check .

      - name: Type check
        run: uv run --package ${{ matrix.service }} mypy app

  # ---------------------------------------------------------------------------
  # Lint + format + type-check the shared package (lives at the repo root,
  # outside any single service). Mirrors the shared part of `make lint`.
  # ---------------------------------------------------------------------------
  quality-shared:
    name: Quality (shared)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.5"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        # Only the shared package — it has no transitive service deps, and
        # this keeps the lint job fast.
        run: uv sync --frozen --package shared

      - name: Ruff lint
        run: uv run --package shared ruff check shared

      - name: Ruff format check
        run: uv run --package shared ruff format --check shared

      - name: Type check
        working-directory: shared
        run: uv run --package shared mypy src

  # ---------------------------------------------------------------------------
  # Unit tests for the shared package. No broker and no Docker: the forcing
  # tests against a real RabbitMQ are marked `integration` and run in
  # `tests-broker` below.
  # ---------------------------------------------------------------------------
  tests-shared:
    name: Tests (shared)
    runs-on: ubuntu-latest
    needs: [quality, quality-shared]

    defaults:
      run:
        working-directory: shared

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.5"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen --package shared

      - name: Run unit tests
        run: uv run --package shared pytest -q -m "not integration"

  # ---------------------------------------------------------------------------
  # Retry/DLQ forcing test against a real RabbitMQ (testcontainers on the
  # runner's Docker). Only the fast scenario (permanent failure -> DLQ) runs
  # here; the two `slow` ones wait through ~4 min of real TTLs and stay local
  # (`make test-broker`). Issue #39.
  # ---------------------------------------------------------------------------
  tests-broker:
    name: Tests (shared, RabbitMQ)
    runs-on: ubuntu-latest
    needs: [quality, quality-shared]

    defaults:
      run:
        working-directory: shared

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.5"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen --package shared

      - name: Run forcing test (fast scenario)
        run: uv run --package shared pytest -q -m "integration and not slow" tests/integration/

  # ---------------------------------------------------------------------------
  # Tests for the services that own a database (order, inventory). Each gets a
  # throwaway Postgres 16 service container with a pg_isready healthcheck. With
  # CI set, the conftest builds its DB URL from the db_* variables below
  # instead of starting a testcontainer. Coverage gate lives in each
  # pyproject.toml (fail_under: order 85, inventory 80).
  # ---------------------------------------------------------------------------
  tests-db:
    name: Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [quality, quality-shared]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: order-service
            db_name: orders
            db_user: orders
          - service: inventory-service
            db_name: inventory
            db_user: inventory

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ matrix.db_name }}
          POSTGRES_USER: ${{ matrix.db_user }}
          # Throwaway DB reachable only from this job: with trust auth no
          # password exists anywhere, so none can leak.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    env:
      db_host: localhost
      db_port: "5432"
      db_user: ${{ matrix.db_user }}
      db_password: ""
      db_name: ${{ matrix.db_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.5"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen --all-packages

      - name: Run test suite
        run: uv run --package ${{ matrix.service }} pytest -q --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.xml

  # ---------------------------------------------------------------------------
  # Tests for notification-service, which has no database in Fase 0 — no
  # Postgres service container needed.
  # ---------------------------------------------------------------------------
  tests:
    name: Tests (notification-service)
    runs-on: ubuntu-latest
    needs: [quality, quality-shared]

    defaults:
      run:
        working-directory: services/notification-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.5"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen --all-packages

      - name: Run test suite
        run: uv run --package notification-service pytest -q --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-notification-service
          path: services/notification-service/coverage.xml

  # ---------------------------------------------------------------------------
  # Build the three images and smoke-test them.
  #
  # Nothing else in this pipeline touches Docker: quality and tests run against
  # the runner's own Python, and the e2e suite is local-only by design
  # (ADR-0017). Without this job a broken Dockerfile reaches the VM undetected,
  # because `deploy/deploy.sh` builds there — production would be the first
  # place the image is ever assembled.
  #
  # The build alone is not enough. An over-aggressive `.dockerignore` (ADR-0015)
  # still builds green and yields an image that only fails at runtime, when a
  # file it swallowed turns out to be needed. That is why the smoke step imports
  # the real module graph inside each image: `shared/` proves the cross-service
  # package arrived, `app.main` proves the service's own code and its installed
  # dependencies did too. Importing `app.main` never opens a socket — the
  # FastAPI lifespan only runs when the app starts serving.
  # ---------------------------------------------------------------------------
  build-images:
    name: Build images
    runs-on: ubuntu-latest
    needs: [quality, quality-shared]

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Provide compose environment
        # docker-compose.yml interpolates ${...} into `environment:` and
        # `ports:`, and refuses to run without the passwords. Same script as
        # `make env`: throwaway random secrets; the containers never start.
        run: python3 scripts/generate_env.py

      - name: Build service images
        run: docker compose build order-service inventory-service notification-service

      - name: Smoke — shared/ and app/ made it into every image
        run: |
          for service in order-service inventory-service notification-service; do
            echo "::group::$service"
            docker compose run --rm --no-deps "$service" python -c \
              "import shared.contracts.order_events, shared.observability.metrics, app.main; print('ok')"
            echo "::endgroup::"
          done