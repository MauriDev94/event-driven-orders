# ----------------------------------------------------------------------------
# Event-Driven Orders — full local stack
#
# Build context is the REPO ROOT for every service (not the service folder) so
# that the shared `shared/contracts/` package is available inside each image.
# Each service points to its own Dockerfile via `build.dockerfile`.
#
# Users, ports and secrets come from `.env` (`make env` writes it from
# `.env.example` with random passwords). `${VAR:?}` makes compose refuse to
# start when a password is missing, instead of booting a broker or DB without
# one: run `make env` first.
# ----------------------------------------------------------------------------

services:
  # --- Infrastructure ------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: edo_rabbitmq
    # RabbitMQ keeps its data in a directory named after the node, and the node
    # name comes from the hostname (the container id by default). A fixed one
    # lets a recreated container find its queues and messages in the volume.
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?}
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
      - "15692:15692"  # Prometheus metrics
    volumes:
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - edo_net

  postgres-orders:
    image: postgres:16-alpine
    container_name: edo_postgres_orders
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ORDERS_DB_USER}
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:?}
      POSTGRES_DB: ${ORDERS_DB_NAME}
    ports:
      - "${ORDERS_DB_PORT}:5432"
    volumes:
      - postgres_data_orders:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDERS_DB_USER} -d ${ORDERS_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - edo_net

  postgres-inventory:
    image: postgres:16-alpine
    container_name: edo_postgres_inventory
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${INVENTORY_DB_USER}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:?}
      POSTGRES_DB: ${INVENTORY_DB_NAME}
    ports:
      - "${INVENTORY_DB_PORT}:5432"
    volumes:
      - postgres_data_inventory:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INVENTORY_DB_USER} -d ${INVENTORY_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - edo_net

  postgres-assistant:
    image: postgres:16-alpine
    container_name: edo_postgres_assistant
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ASSISTANT_DB_USER}
      POSTGRES_PASSWORD: ${ASSISTANT_DB_PASSWORD:?}
      POSTGRES_DB: ${ASSISTANT_DB_NAME}
    ports:
      - "${ASSISTANT_DB_PORT}:5432"
    volumes:
      - postgres_data_assistant:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ASSISTANT_DB_USER} -d ${ASSISTANT_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - edo_net

  # Rate limit of the assistant's questions and cache of its timelines
  # (ADR-0023). Nothing in it has to survive a restart, so persistence is off.
  redis:
    image: redis:8.8-alpine
    container_name: edo_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      # redis-cli reads the password from here, so the healthcheck needs no -a.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --save '' --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edo_net

  # Multi-arch (the prod VM is arm64, which mailhog/mailhog never shipped).
  # The image has its own healthcheck (`mailpit readyz`).
  mailpit:
    image: axllent/mailpit:v1.32.0
    container_name: edo_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI and API
    networks:
      - edo_net

  # --- Services ------------------------------------------------------------
  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: edo_order_service
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      DB_HOST: postgres-orders
      DB_PORT: 5432
      DB_USER: ${ORDERS_DB_USER}
      DB_PASSWORD: ${ORDERS_DB_PASSWORD}
      DB_NAME: ${ORDERS_DB_NAME}
    ports:
      - "8001:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres-orders:
        condition: service_healthy
    networks:
      - edo_net

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    container_name: edo_inventory_service
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      DB_HOST: postgres-inventory
      DB_PORT: 5432
      DB_USER: ${INVENTORY_DB_USER}
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      DB_NAME: ${INVENTORY_DB_NAME}
    ports:
      - "8002:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres-inventory:
        condition: service_healthy
    networks:
      - edo_net

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: edo_notification_service
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SENDER_EMAIL: ${SMTP_SENDER_EMAIL}
    ports:
      - "8003:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    networks:
      - edo_net

  # TypeScript/NestJS. Projects the five order events into its own read model;
  # the image runs `prisma migrate deploy` before starting.
  assistant-service:
    build:
      context: .
      dockerfile: services/assistant-service/Dockerfile
    container_name: edo_assistant_service
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      DATABASE_URL: postgresql://${ASSISTANT_DB_USER}:${ASSISTANT_DB_PASSWORD}@postgres-assistant:5432/${ASSISTANT_DB_NAME}
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379/0
      # `fake` answers with fixed rules and needs no key, so `make up` works
      # out of the box. For the real model set LLM_PROVIDER=gemini and
      # GEMINI_API_KEY in the root env file (ADR-0022).
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8004:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres-assistant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edo_net

  # --- Observability -------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: edo_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - edo_net
    depends_on:
      - order-service
      - inventory-service
      - notification-service
      - assistant-service

  grafana:
    image: grafana/grafana:12.0.1
    container_name: edo_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
    networks:
      - edo_net
    depends_on:
      - prometheus

volumes:
  rabbitmq_data:
  postgres_data_orders:
  postgres_data_inventory:
  postgres_data_assistant:
  grafana_data:

networks:
  edo_net:
    driver: bridge
