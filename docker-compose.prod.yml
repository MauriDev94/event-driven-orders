# ----------------------------------------------------------------------------
# Event-Driven Orders — production override
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --env-file .env.production up -d --build
#
# Cambios respecto al stack de dev (docker-compose.yml):
#   - restart: always en todos los servicios.
#   - Las bases de datos NO exponen puertos al host (solo red interna edo_net).
#   - RabbitMQ no expone AMQP (5672) ni las métricas al host. La management UI
#     se publica solo en 127.0.0.1:15672 de la VM y se entra por túnel SSH:
#       ssh -L 15672:127.0.0.1:15672 <usuario>@<vm>   ->  http://localhost:15672
#     No va detrás de Caddy: su JavaScript manda su propio header Authorization
#     en cada llamada a /api/, y el basic auth de Caddy lo rechazaría.
#   - Se agrega Caddy como reverse proxy con auto-HTTPS (Let's Encrypt),
#     único punto de entrada desde internet (puertos 80/443).
#
# Requisito: Docker Compose >= 2.24.4 (enero 2024) para que `!reset []` limpie
# los `ports` heredados del compose base y `!override` los reemplace. Verificar
# con `docker compose version` (Ubuntu/Docker oficiales en 2026 ya cumplen de
# sobra). En versiones más viejas se ignoran sin error, pero los puertos del
# compose base quedarían publicados.
# ----------------------------------------------------------------------------

services:
  rabbitmq:
    restart: always
    ports: !override
      - "127.0.0.1:15672:15672"  # Management UI, only through an SSH tunnel

  postgres-orders:
    restart: always
    ports: !reset []

  postgres-inventory:
    restart: always
    ports: !reset []

  mailpit:
    restart: always
    ports: !reset []

  order-service:
    restart: always
    ports: !reset []

  inventory-service:
    restart: always
    ports: !reset []

  notification-service:
    restart: always
    ports: !reset []

  prometheus:
    restart: always
    ports: !reset []

  grafana:
    restart: always
    ports: !reset []
    environment:
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}/
      GF_USERS_ALLOW_SIGN_UP: "false"

  caddy:
    image: caddy:2-alpine
    container_name: edo_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      MAILPIT_UI_USER: ${MAILPIT_UI_USER}
      MAILPIT_UI_PASSWORD_HASH: ${MAILPIT_UI_PASSWORD_HASH}
      GRAFANA_UI_USER: ${GRAFANA_UI_USER}
      GRAFANA_UI_PASSWORD_HASH: ${GRAFANA_UI_PASSWORD_HASH}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - order-service
      - mailpit
      - grafana
    networks:
      - edo_net

volumes:
  caddy_data:
  caddy_config:
  grafana_data:
