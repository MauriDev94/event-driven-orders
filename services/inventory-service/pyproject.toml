[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E501: line length is handled by the formatter. UP046: keep the explicit
# Generic[Input, Output] base on UseCase (PEP 695 type params not adopted yet).
ignore = ["E501", "UP046"]

[tool.ruff.lint.per-file-ignores]
# Alembic env.py resolves the DB URL before importing app models — those imports
# are intentionally below module-level code, so E402 is expected here.
"app/core/data/source/local/alembic/env.py" = ["E402"]

[tool.pytest.ini_options]
# `.` makes the local `app` package importable; `../..` makes the repo-root
# `shared` package importable when running tests from this service folder.
pythonpath = [".", "../.."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: pure domain/application tests with no I/O",
    "integration: tests that exercise the app or external boundaries",
]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Starlette types add_exception_handler for the base Exception signature only.
# Our domain-specific handlers (NotFoundError, ConflictError, ...) are valid at
# runtime but mypy can't verify the narrowed exception type.
module = "app.core.exceptions.error_handling"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
# aio-pika stubs declare AbstractRobustConnection.channel() as returning the
# base AbstractChannel; at runtime it is a robust channel, so the attribute
# annotation is correct and the assignment is safe.
module = "app.core.messaging.connection"
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
# Alembic's env.py is generated boilerplate; the DB URL resolved from env vars
# is seen as str | None by mypy even though it is always set at runtime.
module = "app.core.data.source.local.alembic.env"
ignore_errors = true

[[tool.mypy.overrides]]
# CursorResult is the runtime type returned by session.execute() for DML
# statements; SQLAlchemy stubs type it as Result[Any] which lacks .rowcount.
# The type: ignore comments on those lines are the precise fix; this override
# silences the remaining attribute-level false positive from the stubs.
module = "app.features.inventory.infrastructure.persistence.sqlalchemy_inventory_repository"
disable_error_code = ["attr-defined"]

[tool.coverage.run]
source = ["app"]
omit = ["*/__init__.py", "tests/*"]

[tool.coverage.report]
show_missing = true
# Fase 2: full use-case + repository + consumer coverage. Real coverage ~84%.
# Gate at 80 leaves a margin for the uncovered lines (aio-pika publisher,
# DI wiring, lifespan broker path) that require a real broker to exercise.
fail_under = 80
