[project]
name = "notification-service"
version = "0.1.0"
description = "Email notification + event consumption"
requires-python = ">=3.12"
# `shared` is a workspace member — uv resolves it as an editable install at
# sync time. Notification has no DB: SQLAlchemy / psycopg2 / alembic are NOT
# declared here. Common runtime deps come transitively from `shared`.
dependencies = [
    "shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Tell uv that `shared` is the workspace member at ../shared, not a registry
# package. Without this, uv looks up `shared` on PyPI and fails.
[tool.uv.sources]
shared = { workspace = true }

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "httpx==0.28.1",
    "ruff==0.15.11",
    "pytest-cov==7.1.0",
    "mypy==2.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E501: line length is handled by the formatter. UP046: keep the explicit
# Generic[Input, Output] base on UseCase (PEP 695 type params not adopted yet).
ignore = ["E501", "UP046"]

[tool.pytest.ini_options]
# `.` makes the local `app` package importable; `../..` is kept as a safety
# net for the transition — with `shared` installed as a workspace member it is
# no longer strictly needed, but removing it is a separate cleanup.
pythonpath = [".", "../.."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: pure domain/application tests with no I/O",
    "integration: tests that exercise the app or external boundaries",
]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Starlette types add_exception_handler for the base Exception signature only.
# Our domain-specific handlers (NotificationError, ValidationError, ...) are
# valid at runtime but mypy can't verify the narrowed exception type.
module = "app.core.exceptions.error_handling"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
# aio-pika stubs declare AbstractRobustConnection.channel() as returning the
# base AbstractChannel; at runtime it is a robust channel, so the attribute
# annotation is correct and the assignment is safe.
module = "app.core.messaging.connection"
disable_error_code = ["assignment"]

[tool.coverage.run]
source = ["app"]
omit = ["*/__init__.py", "tests/*"]

[tool.coverage.report]
show_missing = true
# Phase 4 raised real coverage to ~92% (use case, mapper, consumer, SMTP
# adapter, DI and topology all under test). Gate set to 85 to match
# order-service, leaving headroom for the broker-only paths (connection.py and
# the consumer-start branch in main.py) that need a live RabbitMQ.
fail_under = 85